[package]
name = "geam-gramps-embedding"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[package.metadata.geam.embedding]
generate = "both"

[dependencies]
geam = { git = "https://github.com/panarch/geam.git", rev = "08b5651661f83d59423ff20e271c62fb42a2f2ae", default-features = false, features = ["embedding", "gleam-stdlib", "gleam-erlang", "tokio", "geam-builtin"] }
geam-gramps = { path = "../.." }
geam-crypto = { path = "../../../gleam-crypto" }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
tempfile = "3.27.0"

[workspace]
resolver = "3"
