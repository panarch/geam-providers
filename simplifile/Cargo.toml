[package]
name = "geam-simplifile"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original simplifile package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "simplifile", "provider"]
categories = ["filesystem"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "simplifile"
gleam-version = ">= 2.7.0 and < 2.7.1"

[package.metadata.geam.ci]
runners = ["ubuntu-24.04", "macos-15", "windows-2025"]

[dependencies]
geam.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
geam-filepath = { path = "../filepath" }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
tempfile = "3.27.0"
