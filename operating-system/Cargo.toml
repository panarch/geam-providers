[package]
name = "geam-operating-system"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original operating_system package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "operating-system", "provider"]
categories = ["os"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "operating_system"
gleam-version = ">= 1.0.1 and < 1.0.2"

[package.metadata.geam.ci]
erlang-oracle = true
runners = ["ubuntu-24.04", "macos-15", "windows-2025"]

[dependencies]
geam.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
