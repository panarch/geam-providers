name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage_provider:
        description: "Provider crate for a focused coverage run; leave blank for full CI"
        type: string
      coverage_runner:
        description: "Declared runner for focused coverage; leave blank for full CI"
        type: string
      run_integrations:
        description: "Run package integration cases on all declared OS runners"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GEAM_REV: 6a6cf4624447b53362bf394513578d708682f0e5

jobs:
  providers:
    name: Discover providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.providers }}
      targets: ${{ steps.matrix.outputs.targets }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      coverage_only: ${{ steps.matrix.outputs.coverage_only }}
      integrations: ${{ steps.matrix.outputs.integrations }}
      has_integrations: ${{ steps.matrix.outputs.has_integrations }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          cache: false
          rustflags: ""

      - name: Install ShellCheck
        uses: taiki-e/install-action@v2
        with:
          tool: shellcheck@0.11.0

      - name: Install actionlint
        shell: bash
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          linters="$RUNNER_TEMP/ci-linters"
          mkdir -p "$linters"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$version/$archive" \
            --output "$linters/$archive"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_checksums.txt" \
            --output "$linters/checksums.txt"
          (cd "$linters" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$linters/$archive" -C "$linters" actionlint
          echo "$linters" >> "$GITHUB_PATH"

      - name: Lint workflows and Bash scripts
        run: bash .github/scripts/lint_ci.sh

      - name: Test CI selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build provider matrix from Cargo metadata
        id: matrix
        shell: bash
        env:
          COVERAGE_PROVIDER: ${{ inputs.coverage_provider }}
          COVERAGE_RUNNER: ${{ inputs.coverage_runner }}
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUN_INTEGRATIONS: ${{ inputs.run_integrations }}
        run: |
          selected="$(python3 .github/scripts/select_providers.py)"
          for output in providers targets has_targets coverage_only integrations has_integrations; do
            value="$(jq -c --arg key "$output" '.[$key]' <<< "$selected")"
            printf '%s=%s\n' "$output" "$value" >> "$GITHUB_OUTPUT"
          done

  quality:
    name: Workspace quality
    needs: providers
    if: needs.providers.outputs.coverage_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check root license and Geam revision
        shell: bash
        run: |
          test -s LICENSE || {
            echo "::error file=LICENSE::Missing root license"
            exit 1
          }
          grep -Fq "rev = \"$GEAM_REV\"" Cargo.toml || {
            echo "::error file=Cargo.toml::Geam revision differs from CI"
            exit 1
          }
          grep -Fq "$GEAM_REV#$GEAM_REV" Cargo.lock || {
            echo "::error file=Cargo.lock::Geam revision is absent from lockfile"
            exit 1
          }

      - name: Download original Gleam packages for Rust tests
        shell: bash
        env:
          PROVIDER_MATRIX: ${{ needs.providers.outputs.matrix }}
        run: |
          while IFS=$'\t' read -r provider_dir gleam_package; do
            for fixture in gleam embedding/gleam; do
              (cd "$provider_dir/fixtures/$fixture" && gleam deps download)
            done
            if [[ -f "$provider_dir/fixtures/upstream.sha256" ]]; then
              (cd "$provider_dir/fixtures/gleam/build/packages/$gleam_package" && \
                sha256sum --check ../../../../upstream.sha256)
            fi
          done < <(jq -r '.include[] | [.dir, .gleam_package] | @tsv' <<< "$PROVIDER_MATRIX")

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test provider and original-source contracts
        run: cargo test --workspace --locked

      - name: Lint provider workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  validate:
    name: Validate (${{ matrix.crate }}, ${{ matrix.runner }})
    needs: providers
    if: needs.providers.outputs.has_targets == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.targets) }}
    env:
      PROVIDER_CRATE: ${{ matrix.crate }}
      PROVIDER_DIR: ${{ matrix.dir }}
      EXAMPLE_DIR: ${{ matrix.example_dir }}
      COVERAGE_ONLY: ${{ needs.providers.outputs.coverage_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.cache_workspaces }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Download original Gleam packages
        run: |
          for fixture in gleam embedding/gleam; do
            (cd "$PROVIDER_DIR/fixtures/$fixture" && gleam deps download)
          done

      - name: Clean coverage profile
        run: cargo llvm-cov clean --workspace

      - name: Require full provider coverage
        run: |
          cargo llvm-cov --package "$PROVIDER_CRATE" --locked \
            --json --summary-only --output-path target/provider-coverage.json
          jq -r '
            .data[].files[]
            | "\(.filename): lines \(.summary.lines.covered)/\(.summary.lines.count), regions \(.summary.regions.covered)/\(.summary.regions.count)"
          ' target/provider-coverage.json
          if ! jq -e --arg prefix "$PROVIDER_DIR/src/" '
            [.data[].files[]
              | select(.filename | gsub("\\\\"; "/")
                  | contains($prefix) and (contains("/../") | not))] as $files
            | ($files | length > 0)
              and ($files | all(.summary.lines.covered == .summary.lines.count
                and .summary.regions.covered == .summary.regions.count))
          ' target/provider-coverage.json; then
            cargo llvm-cov report --package "$PROVIDER_CRATE" --text --show-missing-lines | tail -n 40
            exit 1
          fi

      - name: Check Geam revision in fixtures
        if: env.COVERAGE_ONLY != 'true'
        shell: bash
        run: |
          for manifest in \
            "$PROVIDER_DIR/fixtures/embedding/Cargo.toml" \
            "$PROVIDER_DIR/fixtures/gleam/.cargo/config.toml"; do
            grep -Fq "rev = \"$GEAM_REV\"" "$manifest" || {
              echo "::error file=$manifest::Geam revision differs from CI"
              exit 1
            }
          done
          for lock in \
            "$PROVIDER_DIR/fixtures/embedding/Cargo.lock" \
            "$PROVIDER_DIR/fixtures/gleam/Cargo.lock"; do
            grep -Fq "$GEAM_REV#$GEAM_REV" "$lock" || {
              echo "::error file=$lock::Geam revision is absent from lockfile"
              exit 1
            }
          done
          if [[ -n "$EXAMPLE_DIR" ]]; then
            grep -Fq "rev = \"$GEAM_REV\"" "$PROVIDER_DIR/$EXAMPLE_DIR/.cargo/config.toml" || {
              echo "::error file=$PROVIDER_DIR/$EXAMPLE_DIR/.cargo/config.toml::Geam revision differs from CI"
              exit 1
            }
            grep -Fq "$GEAM_REV#$GEAM_REV" "$PROVIDER_DIR/$EXAMPLE_DIR/Cargo.lock" || {
              echo "::error file=$PROVIDER_DIR/$EXAMPLE_DIR/Cargo.lock::Geam revision is absent from lockfile"
              exit 1
            }
          fi

      - name: Check Gleam source
        if: env.COVERAGE_ONLY != 'true'
        run: |
          for fixture in gleam embedding/gleam; do
            (cd "$PROVIDER_DIR/fixtures/$fixture" && gleam format --check && gleam check)
          done

      - name: Run original Erlang fixture
        if: env.COVERAGE_ONLY != 'true' && matrix.erlang_oracle
        run: bash .github/scripts/run_ci.sh provider "$PROVIDER_DIR" erlang

      - name: Check embedding Rust formatting
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo fmt --all --check

      - name: Lint embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build embedding Rust documentation
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Check package file list
        if: env.COVERAGE_ONLY != 'true'
        shell: bash
        run: |
          files=$(cargo package --list --package "$PROVIDER_CRATE" --locked)
          printf '%s\n' "$files"
          for required in Cargo.toml LICENSE README.md src/lib.rs; do
            grep -Fxq "$required" <<< "$files"
          done
          if grep -Eq '^(fixtures|tests|examples)/|^src/test_support(/|[.]rs$)' <<< "$files"; then
            echo "::error::$PROVIDER_CRATE included a fixture or repository-only test"
            exit 1
          fi

      - name: Check example Gleam source
        if: env.COVERAGE_ONLY != 'true' && matrix.example_dir != ''
        run: |
          (cd "$PROVIDER_DIR/$EXAMPLE_DIR" && gleam deps download && gleam format --check && gleam check)

      - name: Build pinned Geam CLI
        if: env.COVERAGE_ONLY != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/geam-cli-build
        run: |
          geam_source="$RUNNER_TEMP/geam-source"
          git init -q "$geam_source"
          git -C "$geam_source" fetch --depth=1 https://github.com/panarch/geam.git "$GEAM_REV"
          git -C "$geam_source" checkout --detach -q FETCH_HEAD
          test "$(git -C "$geam_source" rev-parse HEAD)" = "$GEAM_REV"
          cargo build --manifest-path "$geam_source/Cargo.toml" \
            --locked --release --bin geam
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "GEAM_BIN=$(cygpath -u "$CARGO_TARGET_DIR")/release/geam.exe" >> "$GITHUB_ENV"
          else
            echo "GEAM_BIN=$CARGO_TARGET_DIR/release/geam" >> "$GITHUB_ENV"
          fi

      - name: Check generated embedding bindings
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: |
          if ! "$GEAM_BIN" embedding check; then
            "$GEAM_BIN" embedding sync
            git diff --numstat -- src/geam_bindings/program.rs
            git diff --unified=1 -- src/geam_bindings/program.rs | sed -n '1,120p'
            exit 1
          fi

      - name: Test Rust embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo test --locked

      - name: Run Rust embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        run: bash .github/scripts/run_ci.sh provider "$PROVIDER_DIR" embedding

      - name: Prepare standalone consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          "$GEAM_BIN" prepare

      - name: Run standalone consumer
        if: env.COVERAGE_ONLY != 'true'
        run: bash .github/scripts/run_ci.sh provider "$PROVIDER_DIR" standalone

      - name: Build standalone executable
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          "$GEAM_BIN" build

      - name: Run executable outside its fixture
        if: env.COVERAGE_ONLY != 'true'
        run: bash .github/scripts/run_ci.sh provider "$PROVIDER_DIR" executable

      - name: Run provider example
        if: env.COVERAGE_ONLY != 'true' && matrix.example_dir != ''
        run: |
          cd "$PROVIDER_DIR/$EXAMPLE_DIR"
          "$GEAM_BIN" prepare
          output=$("$GEAM_BIN" run)
          diff -u expected-output.txt <(printf '%s\n' "$output")

  integrations:
    name: Validate integrations (${{ matrix.runner }})
    needs: providers
    if: needs.providers.outputs.coverage_only != 'true' && needs.providers.outputs.has_integrations == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.integrations) }}
    env:
      CI_INTEGRATIONS: ${{ toJSON(matrix.cases) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache integration builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.cache_workspaces }}

      - name: Check integration sources and dependencies
        run: bash .github/scripts/run_ci.sh integrations source

      - name: Build pinned Geam CLI
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/geam-cli-build
        run: |
          geam_source="$RUNNER_TEMP/geam-source"
          git init -q "$geam_source"
          git -C "$geam_source" fetch --depth=1 https://github.com/panarch/geam.git "$GEAM_REV"
          git -C "$geam_source" checkout --detach -q FETCH_HEAD
          test "$(git -C "$geam_source" rev-parse HEAD)" = "$GEAM_REV"
          cargo build --manifest-path "$geam_source/Cargo.toml" \
            --locked --release --bin geam
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "GEAM_BIN=$(cygpath -u "$CARGO_TARGET_DIR")/release/geam.exe" >> "$GITHUB_ENV"
          else
            echo "GEAM_BIN=$CARGO_TARGET_DIR/release/geam" >> "$GITHUB_ENV"
          fi

      - name: Run original Erlang references
        run: bash .github/scripts/run_ci.sh integrations erlang

      - name: Check and run embedding consumers
        run: bash .github/scripts/run_ci.sh integrations embedding

      - name: Prepare, run and build standalone consumers
        run: bash .github/scripts/run_ci.sh integrations standalone

      - name: Run executables outside their fixtures
        run: bash .github/scripts/run_ci.sh integrations executable
