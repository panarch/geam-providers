name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      coverage_provider:
        description: "Provider crate for a focused coverage run; leave blank for full CI"
        type: string
      coverage_runner:
        description: "Declared runner for focused coverage; leave blank for full CI"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GEAM_REV: bd95b872c578df88f76ed5c4175fb1ea55ee8607

jobs:
  providers:
    name: Discover providers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.providers }}
      targets: ${{ steps.matrix.outputs.targets }}
      coverage_only: ${{ steps.matrix.outputs.coverage_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          cache: false
          rustflags: ""

      - name: Test CI selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build provider matrix from Cargo metadata
        id: matrix
        shell: bash
        env:
          COVERAGE_PROVIDER: ${{ inputs.coverage_provider }}
          COVERAGE_RUNNER: ${{ inputs.coverage_runner }}
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          provider_rows="$(
            cargo metadata --no-deps --format-version 1 --locked |
              jq -ce --arg root "$GITHUB_WORKSPACE/" '
                .workspace_members as $members
                | [
                    .packages[]
                    | select(.id as $id | $members | index($id))
                    | select(.metadata.geam.provider != null)
                    | {
                        crate: .name,
                        dir: (.manifest_path | sub("/Cargo.toml$"; "") | ltrimstr($root)),
                        gleam_package: .metadata.geam.provider."gleam-package",
                        fixture_bin: (.metadata.geam.ci."fixture-bin" // (.name | gsub("-"; "_") + "_fixture")),
                        integration_case: (.metadata.geam.ci."integration-case" // "standard"),
                        example_dir: (.metadata.geam.ci."example-dir" // ""),
                        runners: (.metadata.geam.ci.runners // ["ubuntu-24.04"])
                      }
                  ]
                | select(length > 0 and all(.[];
                    (.runners | length > 0)
                    and (.integration_case == "standard" or .integration_case == "httpc")))
              '
          )"
          targets="$(jq -c '{include: [.[] | . as $provider | .runners[] | $provider + {runner: .} | del(.runners)]}' <<< "$provider_rows")"
          if [[ -n "$COVERAGE_PROVIDER" || -n "$COVERAGE_RUNNER" ]]; then
            if [[ -z "$COVERAGE_PROVIDER" || -z "$COVERAGE_RUNNER" ]]; then
              echo "::error::Set both coverage_provider and coverage_runner for a focused run" >&2
              exit 1
            fi
            targets="$(jq -ce --arg crate "$COVERAGE_PROVIDER" --arg runner "$COVERAGE_RUNNER" '
              {include: [.include[] | select(.crate == $crate and .runner == $runner)]}
              | select(.include | length == 1)
            ' <<< "$targets")" || {
              echo "::error::No declared coverage target for $COVERAGE_PROVIDER on $COVERAGE_RUNNER" >&2
              exit 1
            }
            echo "coverage_only=true" >> "$GITHUB_OUTPUT"
          else
            if [[ "$CI_EVENT" == push || "$CI_EVENT" == pull_request ]]; then
              selected="$(PROVIDER_ROWS="$provider_rows" python3 .github/scripts/select_providers.py)"
              targets="$(jq -c --argjson selected "$selected" '
                {include: [.include[] | select(.crate as $crate | $selected | index($crate) != null)]}
              ' <<< "$targets")"
            fi
            echo "coverage_only=false" >> "$GITHUB_OUTPUT"
          fi
          echo "providers=$(jq -c '{include: map(del(.runners))}' <<< "$provider_rows")" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  quality:
    name: Workspace quality
    needs: providers
    if: needs.providers.outputs.coverage_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          components: rustfmt, clippy
          cache: false
          rustflags: ""

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check root license and Geam revision
        shell: bash
        run: |
          test -s LICENSE || {
            echo "::error file=LICENSE::Missing root license"
            exit 1
          }
          grep -Fq "rev = \"$GEAM_REV\"" Cargo.toml || {
            echo "::error file=Cargo.toml::Geam revision differs from CI"
            exit 1
          }
          grep -Fq "$GEAM_REV#$GEAM_REV" Cargo.lock || {
            echo "::error file=Cargo.lock::Geam revision is absent from lockfile"
            exit 1
          }

      - name: Download original Gleam packages for Rust tests
        shell: bash
        env:
          PROVIDER_MATRIX: ${{ needs.providers.outputs.matrix }}
        run: |
          while IFS=$'\t' read -r provider_dir gleam_package; do
            for fixture in gleam embedding/gleam; do
              (cd "$provider_dir/fixtures/$fixture" && gleam deps download)
            done
            if [[ -f "$provider_dir/fixtures/upstream.sha256" ]]; then
              (cd "$provider_dir/fixtures/gleam/build/packages/$gleam_package" && \
                sha256sum --check ../../../../upstream.sha256)
            fi
          done < <(jq -r '.include[] | [.dir, .gleam_package] | @tsv' <<< "$PROVIDER_MATRIX")

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test provider and original-source contracts
        run: cargo test --workspace --locked

      - name: Lint provider workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build Rust documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  validate:
    name: Validate (${{ matrix.crate }}, ${{ matrix.runner }})
    needs: providers
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.providers.outputs.targets) }}
    env:
      PROVIDER_CRATE: ${{ matrix.crate }}
      PROVIDER_DIR: ${{ matrix.dir }}
      FIXTURE_BIN: ${{ matrix.fixture_bin }}
      EXAMPLE_DIR: ${{ matrix.example_dir }}
      COVERAGE_ONLY: ${{ needs.providers.outputs.coverage_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Gleam toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.96"
          components: rustfmt, clippy, llvm-tools-preview
          cache: false
          rustflags: ""

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ${{ matrix.dir }}/fixtures/embedding -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Download original Gleam packages
        run: |
          for fixture in gleam embedding/gleam; do
            (cd "$PROVIDER_DIR/fixtures/$fixture" && gleam deps download)
          done

      - name: Clean coverage profile
        run: cargo llvm-cov clean --workspace

      - name: Require full provider coverage
        run: |
          cargo llvm-cov --package "$PROVIDER_CRATE" --locked \
            --json --summary-only --output-path target/provider-coverage.json
          jq -r '
            .data[].files[]
            | "\(.filename): lines \(.summary.lines.covered)/\(.summary.lines.count), regions \(.summary.regions.covered)/\(.summary.regions.count)"
          ' target/provider-coverage.json
          jq -e --arg prefix "$PROVIDER_DIR/src/" '
            [.data[].files[]
              | select(.filename | gsub("\\\\"; "/")
                  | contains($prefix) and (contains("/../") | not))] as $files
            | ($files | length > 0)
              and ($files | all(.summary.lines.covered == .summary.lines.count
                and .summary.regions.covered == .summary.regions.count))
          ' target/provider-coverage.json

      - name: Check Geam revision in fixtures
        if: env.COVERAGE_ONLY != 'true'
        shell: bash
        run: |
          for manifest in \
            "$PROVIDER_DIR/fixtures/embedding/Cargo.toml" \
            "$PROVIDER_DIR/fixtures/gleam/.cargo/config.toml"; do
            grep -Fq "rev = \"$GEAM_REV\"" "$manifest" || {
              echo "::error file=$manifest::Geam revision differs from CI"
              exit 1
            }
          done
          for lock in \
            "$PROVIDER_DIR/fixtures/embedding/Cargo.lock" \
            "$PROVIDER_DIR/fixtures/gleam/Cargo.lock"; do
            grep -Fq "$GEAM_REV#$GEAM_REV" "$lock" || {
              echo "::error file=$lock::Geam revision is absent from lockfile"
              exit 1
            }
          done
          if [[ -n "$EXAMPLE_DIR" ]]; then
            grep -Fq "rev = \"$GEAM_REV\"" "$PROVIDER_DIR/$EXAMPLE_DIR/.cargo/config.toml" || {
              echo "::error file=$PROVIDER_DIR/$EXAMPLE_DIR/.cargo/config.toml::Geam revision differs from CI"
              exit 1
            }
            grep -Fq "$GEAM_REV#$GEAM_REV" "$PROVIDER_DIR/$EXAMPLE_DIR/Cargo.lock" || {
              echo "::error file=$PROVIDER_DIR/$EXAMPLE_DIR/Cargo.lock::Geam revision is absent from lockfile"
              exit 1
            }
          fi

      - name: Check Gleam source
        if: env.COVERAGE_ONLY != 'true'
        run: |
          for fixture in gleam embedding/gleam; do
            (cd "$PROVIDER_DIR/fixtures/$fixture" && gleam format --check && gleam check)
          done

      - name: Run original OS-sensitive Erlang fixture
        if: env.COVERAGE_ONLY != 'true' && (matrix.gleam_package == 'platform' || matrix.gleam_package == 'birl')
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: gleam run

      - name: Check embedding Rust formatting
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo fmt --all --check

      - name: Lint embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build embedding Rust documentation
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Check package file list
        if: env.COVERAGE_ONLY != 'true'
        shell: bash
        run: |
          files=$(cargo package --list --package "$PROVIDER_CRATE" --locked)
          printf '%s\n' "$files"
          for required in Cargo.toml LICENSE README.md src/lib.rs; do
            grep -Fxq "$required" <<< "$files"
          done
          if grep -Eq '^(fixtures|tests|examples)/|^src/test_support(/|[.]rs$)' <<< "$files"; then
            echo "::error::$PROVIDER_CRATE included a fixture or repository-only test"
            exit 1
          fi

      - name: Check example Gleam source
        if: env.COVERAGE_ONLY != 'true' && matrix.example_dir != ''
        run: |
          (cd "$PROVIDER_DIR/$EXAMPLE_DIR" && gleam deps download && gleam format --check && gleam check)

      - name: Install pinned Geam CLI
        if: env.COVERAGE_ONLY != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/geam-cli-build
        run: |
          cargo install --git https://github.com/panarch/geam.git \
            --rev "$GEAM_REV" --locked \
            --root "$RUNNER_TEMP/geam-cli" --bin geam geam
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo "GEAM_BIN=$(cygpath -u "$RUNNER_TEMP")/geam-cli/bin/geam.exe" >> "$GITHUB_ENV"
          else
            echo "GEAM_BIN=$RUNNER_TEMP/geam-cli/bin/geam" >> "$GITHUB_ENV"
          fi

      - name: Check generated embedding bindings
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: |
          "$GEAM_BIN" embedding check

      - name: Test Rust embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo test --locked

      - name: Run Rust embedding consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/embedding
        run: cargo run --locked

      - name: Prepare standalone consumer
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          "$GEAM_BIN" prepare

      - name: Run standard standalone consumer
        if: env.COVERAGE_ONLY != 'true' && matrix.integration_case == 'standard'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          "$GEAM_BIN" run

      - name: Run gleam_httpc standalone scenarios
        if: env.COVERAGE_ONLY != 'true' && matrix.integration_case == 'httpc'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          for module in geam_httpc_fixture httpc_redirect httpc_binary httpc_tls; do
            python3 ../server.py "$GEAM_BIN" run --module "$module" \
              --provider-config gleam_httpc=../config/provider.toml
          done

      - name: Build standalone executable
        if: env.COVERAGE_ONLY != 'true'
        working-directory: ${{ matrix.dir }}/fixtures/gleam
        run: |
          "$GEAM_BIN" build

      - name: Locate standalone executable
        if: env.COVERAGE_ONLY != 'true'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            workspace="$(cygpath -u "$GITHUB_WORKSPACE")"
            temp="$(cygpath -u "$RUNNER_TEMP")"
            executable="$FIXTURE_BIN.exe"
          else
            workspace="$GITHUB_WORKSPACE"
            temp="$RUNNER_TEMP"
            executable="$FIXTURE_BIN"
          fi
          echo "FIXTURE_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "FIXTURE_RUN_DIR=$temp" >> "$GITHUB_ENV"
          echo "FIXTURE_BINARY=$workspace/$PROVIDER_DIR/fixtures/gleam/build/geam/target/debug/$executable" >> "$GITHUB_ENV"

      - name: Run standard executable outside its fixture
        if: env.COVERAGE_ONLY != 'true' && matrix.integration_case == 'standard'
        run: |
          cd "$FIXTURE_RUN_DIR"
          "$FIXTURE_BINARY"

      - name: Run gleam_httpc executable outside its fixture
        if: env.COVERAGE_ONLY != 'true' && matrix.integration_case == 'httpc'
        run: |
          cd "$FIXTURE_RUN_DIR"
          if [[ "$RUNNER_OS" == Windows ]]; then
            export GEAM_CONFIG="$(cygpath -w "$FIXTURE_WORKSPACE/$PROVIDER_DIR/fixtures/config/runtime.toml")"
          else
            export GEAM_CONFIG="$FIXTURE_WORKSPACE/$PROVIDER_DIR/fixtures/config/runtime.toml"
          fi
          python3 "$FIXTURE_WORKSPACE/$PROVIDER_DIR/fixtures/server.py" "$FIXTURE_BINARY"

      - name: Run provider example
        if: env.COVERAGE_ONLY != 'true' && matrix.example_dir != ''
        run: |
          cd "$PROVIDER_DIR/$EXAMPLE_DIR"
          "$GEAM_BIN" prepare
          output=$("$GEAM_BIN" run)
          diff -u expected-output.txt <(printf '%s\n' "$output")
