[package]
name = "geam-exception"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original exception package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "exception", "provider"]
categories = ["development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "exception"
gleam-version = ">= 2.1.1 and < 2.1.2"

[package.metadata.geam.ci]
erlang-oracle = true

[dependencies]
geam = { workspace = true, features = ["gleam-stdlib"] }

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
