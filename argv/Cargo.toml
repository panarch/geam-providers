[package]
name = "geam-argv"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original argv package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "argv", "cli", "provider"]
categories = ["command-line-interface"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "argv"
gleam-version = ">= 1.1.0 and < 1.1.1"

[package.metadata.geam.ci]
runners = ["ubuntu-24.04", "macos-15", "windows-2025"]

[dependencies]
geam.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
