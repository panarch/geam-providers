[package]
name = "geam-directories-embedding"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
geam = { git = "https://github.com/panarch/geam.git", rev = "cf5fb100c9220d9e30ff60a11d5bfbeb77f1ebef", default-features = false, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
geam-envoy = { path = "../../../../envoy" }
geam-filepath = { path = "../../../../filepath" }
geam-platform = { path = "../../../../platform" }
geam-simplifile = { path = "../../../../simplifile" }
tempfile = "3.27.0"
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }

[workspace]
resolver = "3"
