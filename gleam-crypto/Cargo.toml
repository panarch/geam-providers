[package]
name = "geam-crypto"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original gleam_crypto package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "crypto", "provider"]
categories = ["cryptography", "development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "gleam_crypto"
gleam-version = ">= 1.6.0 and < 1.6.1"

[dependencies]
geam.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
getrandom.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
