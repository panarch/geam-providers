[package]
name = "geam-logging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original logging package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "logging", "provider"]
categories = ["development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "logging"
gleam-version = ">= 1.5.0 and < 1.5.1"

[dependencies]
geam.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
