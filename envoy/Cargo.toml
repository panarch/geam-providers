[package]
name = "geam-envoy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original envoy package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "envoy", "environment", "provider"]
categories = ["development-tools"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "envoy"
gleam-version = ">= 1.2.0 and < 1.2.1"

[package.metadata.geam.ci]
runners = ["ubuntu-24.04", "macos-15", "windows-2025"]
erlang-oracle = true

[dependencies]
geam = { workspace = true, features = ["gleam-stdlib"] }

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
