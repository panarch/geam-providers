[package]
name = "geam-houdini"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original houdini package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "houdini", "provider"]
categories = ["text-processing", "web-programming"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "houdini"
gleam-version = ">= 1.2.0 and < 1.2.1"

[dependencies]
geam.workspace = true
geam-core.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
