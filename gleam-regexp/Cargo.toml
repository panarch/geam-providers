[package]
name = "geam-regexp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original gleam_regexp package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "regex", "provider"]
categories = ["development-tools", "text-processing"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "gleam_regexp"
gleam-version = ">= 1.1.1 and < 1.1.2"

[dependencies]
geam.workspace = true
regex.workspace = true
regex-syntax.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
