[package]
name = "geam-filepath"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original filepath package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "filepath", "provider"]
categories = ["filesystem"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "filepath"
gleam-version = ">= 1.1.2 and < 1.1.3"

[dependencies]
geam.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
