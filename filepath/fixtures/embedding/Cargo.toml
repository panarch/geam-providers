[package]
name = "geam-filepath-embedding"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
geam = { git = "https://github.com/panarch/geam.git", rev = "6a6cf4624447b53362bf394513578d708682f0e5", default-features = false, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
geam-filepath = { path = "../.." }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }

[workspace]
resolver = "3"
