[package]
name = "geam-glisten"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original glisten package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/", "src/test_support.rs", "src/test_support/"]
autotests = false
keywords = ["geam", "gleam", "tcp", "tls", "provider"]
categories = ["network-programming", "development-tools"]

[package.metadata.geam.provider]
schema = 2
gleam-package = "glisten"
gleam-version = ">= 9.0.1 and < 9.0.2"
component = "plain"
execution-service = true
requires-services = ["gleam_erlang"]

[package.metadata.geam.ci]
fixture-bin = "geam_glisten_fixture"
integration-case = "glisten"
erlang-oracle = true
runners = ["ubuntu-24.04", "macos-15", "windows-2025"]

[dependencies]
geam = { workspace = true, features = ["gleam-erlang"] }
parking_lot = "0.12.5"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-pemfile = "2.2"
socket2 = { version = "0.6.5", features = ["all"] }

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
geam-otp = { path = "../gleam-otp" }
geam-logging = { path = "../logging" }
geam-argv = { path = "../argv" }
sha2.workspace = true
camino = "1"
rcgen = "0.14.10"
