[package]
name = "geam-glisten-embedding"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[package.metadata.geam.embedding]
generate = "both"

[dependencies]
geam = { git = "https://github.com/panarch/geam.git", rev = "08b5651661f83d59423ff20e271c62fb42a2f2ae", default-features = false, features = ["embedding", "gleam-erlang", "geam-builtin", "tokio", "gleam-stdlib"] }
geam-glisten = { path = "../.." }
geam-otp = { path = "../../../gleam-otp" }
geam-logging = { path = "../../../logging" }
geam-argv = { path = "../../../argv" }
tokio = { version = "1.53.1", features = ["rt", "time"] }

[workspace]
resolver = "3"
