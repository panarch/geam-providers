[package]
name = "geam-splitter"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Geam Rust provider for the original splitter package"
repository = "https://github.com/panarch/geam-providers"
readme = "README.md"
exclude = ["fixtures/", "tests/"]
keywords = ["geam", "gleam", "splitter", "provider"]
categories = ["parsing", "text-processing"]

[package.metadata.geam.provider]
schema = 1
gleam-package = "splitter"
gleam-version = ">= 1.3.0 and < 1.3.1"

[dependencies]
geam.workspace = true
memchr.workspace = true

[dev-dependencies]
geam = { workspace = true, features = ["embedding", "gleam-stdlib", "tokio", "geam-builtin"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt"] }
